name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily full-suite run at 06:00 UTC.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: short
            go-test-args: "-race -short"
          - mode: full
            go-test-args: "-race"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # TRYGALLE_PI_TESTS=on makes the suite fail on a wrong pi install
      # instead of silently skipping the live tests.
      - name: Install pinned pi
        if: matrix.mode == 'full'
        run: npm install --global @earendil-works/pi-coding-agent@1.5.2
      - name: Run tests
        run: go test ${{ matrix.go-test-args }} ./...
        env:
          TRYGALLE_PI_TESTS: ${{ matrix.mode == 'full' && 'on' || 'auto' }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t trygalle:smoke .
      - name: Run image smoke checks
        run: scripts/image-smoke.sh trygalle:smoke

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # chart-testing inspects git history to find charts to lint.
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: helm/chart-testing-action@v2
      # --all lints every fixture on pushes to main too, where the
      # changed-chart diff against the target branch is empty.
      - name: Lint chart
        run: ct lint --config ct.yaml --all
      - name: Assert rendered templates
        run: |
          set -euo pipefail
          fail() {
            echo "FAIL: $1" >&2
            exit 1
          }

          helm template trygalle deploy/trygalle \
            -f deploy/trygalle/ci/ci-default-values.yaml > /tmp/render-default.yaml \
            || fail "default fixture render"
          helm template trygalle deploy/trygalle \
            -f deploy/trygalle/ci/ci-existing-secret-values.yaml > /tmp/render-existing.yaml \
            || fail "existing-secret fixture render"
          helm template trygalle deploy/trygalle \
            -f deploy/trygalle/ci/ci-rbac-values.yaml > /tmp/render-rbac.yaml \
            || fail "rbac fixture render"

          # Default fixture: complete install with passthroughs.
          grep -qE 'subPath: sessions' /tmp/render-default.yaml \
            || fail "default: sessions subPath mount missing"
          grep -qE 'subPath: work' /tmp/render-default.yaml \
            || fail "default: work subPath mount missing"
          grep -qE 'serviceAccountName: trygalle$' /tmp/render-default.yaml \
            || fail "default: serviceAccountName missing"
          grep -qE 'value: "/data/pi/sessions"' /tmp/render-default.yaml \
            || fail "default: TRYGALLE_SESSION_DIR value missing"
          grep -qE 'name: TRYGALLE_TELEGRAM_TOKEN' /tmp/render-default.yaml \
            || fail "default: telegram token env missing"
          grep -qE 'name: TRYGALLE_TELEGRAM_ALLOWED_USER' /tmp/render-default.yaml \
            || fail "default: telegram allowed-user env missing"
          grep -qE 'name: DUMMY_PROVIDER_KEY' /tmp/render-default.yaml \
            || fail "default: provider env missing"
          grep -qE 'telegram-token: "123456:AaDUMMYTOKEN"' /tmp/render-default.yaml \
            || fail "default: Secret token key missing"
          grep -qE 'telegram-allowed-user: "42"' /tmp/render-default.yaml \
            || fail "default: Secret allowed-user key missing"
          grep -qE 'kind: PersistentVolumeClaim' /tmp/render-default.yaml \
            || fail "default: PVC missing"
          grep -qE 'storage: 5Gi' /tmp/render-default.yaml \
            || fail "default: PVC size missing"
          grep -qE 'name: dummy-extra-volume' /tmp/render-default.yaml \
            || fail "default: extraVolumes passthrough missing"
          grep -qE 'name: dummy-sidecar' /tmp/render-default.yaml \
            || fail "default: extraContainers passthrough missing"
          grep -qE '^kind: (Role|RoleBinding|ClusterRole|ClusterRoleBinding)$' /tmp/render-default.yaml \
            && fail "default: RBAC rendered with empty lists"

          # Existing-secret fixture: no chart Secret, user Secret referenced.
          grep -qE 'kind: Secret' /tmp/render-existing.yaml \
            && fail "existing: chart Secret rendered"
          grep -qE 'name: trygalle-creds' /tmp/render-existing.yaml \
            || fail "existing: existingSecret name missing"
          grep -qE 'key: token-key' /tmp/render-existing.yaml \
            || fail "existing: telegram token key missing"
          grep -qE 'key: allowed-user-key' /tmp/render-existing.yaml \
            || fail "existing: telegram allowed-user key missing"
          grep -qE 'name: EXISTING_PROVIDER_KEY' /tmp/render-existing.yaml \
            || fail "existing: provider env name missing"
          grep -qE 'key: EXISTING_PROVIDER_KEY' /tmp/render-existing.yaml \
            || fail "existing: provider key not read under its environment name"

          # RBAC fixture: four kinds, defaulted names, rules carried through,
          # no namespace on the cluster-scoped kinds.
          grep -qE '^kind: Role$' /tmp/render-rbac.yaml || fail "rbac: Role missing"
          grep -qE '^kind: RoleBinding$' /tmp/render-rbac.yaml \
            || fail "rbac: RoleBinding missing"
          grep -qE '^kind: ClusterRole$' /tmp/render-rbac.yaml \
            || fail "rbac: ClusterRole missing"
          grep -qE '^kind: ClusterRoleBinding$' /tmp/render-rbac.yaml \
            || fail "rbac: ClusterRoleBinding missing"
          grep -qE 'name: trygalle-role$' /tmp/render-rbac.yaml \
            || fail "rbac: Role default name missing"
          grep -qE 'name: trygalle-role-binding$' /tmp/render-rbac.yaml \
            || fail "rbac: RoleBinding default name missing"
          grep -qE 'name: trygalle-cluster-role$' /tmp/render-rbac.yaml \
            || fail "rbac: ClusterRole default name missing"
          grep -qE 'name: trygalle-cluster-role-binding$' /tmp/render-rbac.yaml \
            || fail "rbac: ClusterRoleBinding default name missing"
          grep -qE -- '- pods' /tmp/render-rbac.yaml \
            || fail "rbac: Role rules not carried through"
          grep -qE -- '- nodes' /tmp/render-rbac.yaml \
            || fail "rbac: ClusterRole rules not carried through"
          if grep -A3 '^kind: ClusterRole$' /tmp/render-rbac.yaml | grep -qE 'namespace:'; then \
            fail "rbac: ClusterRole has metadata.namespace"; \
          fi
          if grep -A3 '^kind: ClusterRoleBinding$' /tmp/render-rbac.yaml | grep -qE 'namespace:'; then \
            fail "rbac: ClusterRoleBinding has metadata.namespace"; \
          fi

          # Persistence: disabled renders no PVC and no /data/pi mounts;
          # existingClaim replaces the created PVC.
          helm template trygalle deploy/trygalle \
            -f deploy/trygalle/ci/ci-default-values.yaml \
            --set persistence.enabled=false > /tmp/render-no-pvc.yaml \
            || fail "persistence-off render"
          grep -qE 'kind: PersistentVolumeClaim' /tmp/render-no-pvc.yaml \
            && fail "persistence off: PVC rendered"
          grep -qE 'mountPath: /data/pi' /tmp/render-no-pvc.yaml \
            && fail "persistence off: /data/pi mount rendered"
          grep -qE 'persistentVolumeClaim:' /tmp/render-no-pvc.yaml \
            && fail "persistence off: claim reference rendered"
          grep -qE 'name: dummy-extra-volume' /tmp/render-no-pvc.yaml \
            || fail "persistence off: extraVolumes passthrough dropped"
          helm template trygalle deploy/trygalle \
            -f deploy/trygalle/ci/ci-default-values.yaml \
            --set persistence.existingClaim=my-claim > /tmp/render-existing-claim.yaml \
            || fail "existing-claim render"
          grep -qE 'claimName: my-claim' /tmp/render-existing-claim.yaml \
            || fail "existing claim: claimName missing"
          grep -qE 'kind: PersistentVolumeClaim' /tmp/render-existing-claim.yaml \
            && fail "existing claim: PVC rendered"

          # Schema: the strict values.schema.json rejects incomplete values.
          # Helm's rejection message does not name the file, so the assertion
          # matches the schema-validation signature it always produces.
          if helm template trygalle deploy/trygalle \
            --set secret.create=true --set telegram.token= \
            >/dev/null 2>/tmp/schema-err.txt; then \
            fail "schema: empty token accepted"; \
          fi
          grep -qE "values don't meet the specifications of the schema" /tmp/schema-err.txt \
            || fail "schema: rejection without schema signature"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
