name: Release

# Publishes on merges to main only. There is no v* tag trigger: a tag pushed
# with the default GITHUB_TOKEN does not trigger a workflow, so the release
# job itself builds and pushes the image after semantic-release reports a
# published release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs every commit and tag to compute the version.
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every artifact step below is gated on new_release_published so a merge
      # without a release-warranting commit pushes nothing.
      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test single-platform image
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          docker build --load -t trygalle:release .
          scripts/image-smoke.sh trygalle:release

      - name: Push release image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/maruina/trygalle:v${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/maruina/trygalle:latest
          labels: |
            org.opencontainers.image.version=${{ steps.semantic.outputs.new_release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
