# Chart-testing fixture: existing-secret mode with dummy values only.
# The chart creates no Secret; the StatefulSet reads the named keys from
# the user-supplied Secret.
secret:
  create: false
  existingSecret: trygalle-creds
  keys:
    telegramToken: token-key
    telegramAllowedUser: allowed-user-key

telegram:
  allowedUser: 42

providerEnv:
  EXISTING_PROVIDER_KEY: dummy-existing-value
