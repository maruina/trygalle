{{- $fullname := include "trygalle.fullname" . }}
{{- $secretName := default $fullname .Values.secret.existingSecret }}
{{- $telegramTokenKey := .Values.secret.keys.telegramToken }}
{{- $telegramAllowedUserKey := .Values.secret.keys.telegramAllowedUser }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trygalle.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fullname }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "trygalle.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trygalle.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trygalle.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.persistence.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $fullname .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: trygalle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.trygalle.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: TRYGALLE_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $telegramTokenKey }}
            - name: TRYGALLE_TELEGRAM_ALLOWED_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $telegramAllowedUserKey }}
            {{- range $name, $value := .Values.providerEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $name }}
            {{- end }}
            - name: TRYGALLE_SESSION_DIR
              value: {{ .Values.trygalle.sessionDir | quote }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.persistence.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data/pi/sessions
              subPath: sessions
            - name: data
              mountPath: /data/pi/work
              subPath: work
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
