{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trygalle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trygalle.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.telegramToken }}: {{ .Values.telegram.token | quote }}
  {{ .Values.secret.keys.telegramAllowedUser }}: {{ .Values.telegram.allowedUser | quote }}
  {{- range $name, $value := .Values.providerEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
