{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trygalle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trygalle.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.telegramToken }}: {{ .Values.telegram.token | quote }}
  # int64 first: helm decodes values numbers as float64, and %v of a large
  # ID (e.g. 92875422) renders scientific notation into the Secret key.
  {{ .Values.secret.keys.telegramAllowedUser }}: {{ .Values.telegram.allowedUser | int64 | quote }}
  {{- range $name, $value := .Values.providerEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
